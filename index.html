const PI_=Math.PI;

function NewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=PI_/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));let dt;if(T<-11)dt=0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3;else dt=-0.000278+0.000265*T+0.000262*T2;return Jd1+C1-dt}

 if(f==='fav')L=L.filter(it=>it.fav);
 if(tab==='fun'&&(f==='want'||f==='doing'||f==='done'))L=L.filter(it=>(it.status||'want')===f);
 if(f==='soon')L=L.filter(it=>{const b=nx(it);return b&&b.days<=30});
 if(tab==='note'&&f!=='all'&&f!=='fav')L=L.filter(it=>it.cat===f);
 const vi=(a,b)=>String(a).localeCompare(String(b),'vi');
 if(tab==='song')L.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||vi(a.name,b.name));
 if(tab==='pub')L.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(+b.rating||0)-(+a.rating||0)||vi(a.name,b.name));
 if(tab==='bday'||tab==='gio')L.sort((a,b)=>{const x=nx(a),y=nx(b);return (x?x.days:999)-(y?y.days:999)});
  if(tab==='fun'){const o={doing:0,want:1,done:2};L.sort((a,b)=>o[a.status||'want']-o[b.status||'want']||(b.fav?1:0)-(a.fav?1:0)||vi(a.name,b.name))}
 if(tab==='note')L.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(b.ts||0)-(a.ts||0));
 return L;
}
function chipsFor(){
 if(tab==='song'||tab==='pub')return[['all','Tất cả'],['fav','⭐ Yêu thích']];
 if(tab==='fun')return[['all','Tất cả'],['want','📌 Muốn thử'],['doing','▶️ Đang'],['done','✅ Đã xong'],['fav','⭐ Yêu thích']];
 if(tab==='bday'||tab==='gio')return[['all','Tất cả'],['soon','🔥 30 ngày tới']];
 return[['all','Tất cả'],['fav','📌 Ghim'],['Công việc','💼 Công việc'],['Mua sắm','🛒 Mua sắm'],['Du lịch','✈️ Du lịch'],['Ăn uống','🍜 Ăn uống'],['Khác','✨ Khác']];
}
function card(it){
 const fav=(on,ic)=>`<button class="st${on?' on':''}" data-fav="${it.id}" type="button" aria-label="Đánh dấu">${ic}</button>`;
 if(tab==='song'){
  const s=[it.singer,it.code?'Mã: '+it.code:'',it.key?'Tông: '+it.key:''].filter(Boolean).map(esc).join(' · ');
  return `<div class="it"><div class="m" data-edit="${it.id}"><b>🎵 ${esc(it.name)}</b>${s?`<div class="s">${s}</div>`:''}${it.note?`<div class="n">${esc(it.note)}</div>`:''}</div>${fav(it.fav,'⭐')}</div>`}
 if(tab==='pub'){
  const st=it.rating?'⭐'.repeat(+it.rating):'',pr=it.price?'💰'.repeat(+it.price):'';
  const addr=it.addr?`<div class="s">📍 ${esc(it.addr)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.addr+' '+it.name)}" target="_blank" rel="noopener">Chỉ đường</a></div>`:'';
  const ph=it.phone?`<div class="s">📞 <a href="tel:${esc(String(it.phone).replace(/[^+\d]/g,''))}">${esc(it.phone)}</a></div>`:'';
  return `<div class="it"><div class="m" data-edit="${it.id}"><b>🍻 ${esc(it.name)}</b>${(st||pr)?`<div class="s">${st} ${pr}</div>`:''}${addr}${ph}${it.dishes?`<div class="s">🍽️ Món: ${esc(it.dishes)}</div>`:''}${it.note?`<div class="n">${esc(it.note)}</div>`:''}</div>${fav(it.fav,'❤️')}</div>`}
 if(tab==='bday'){
  const b=nextB(it);let when='',age='';
  if(b){when=b.days===0?'<span class="soon">Hôm nay 🎉</span>':b.days===1?'<span class="soon">Ngày mai</span>':b.days<=30?`<span class="soon">Còn ${b.days} ngày</span>`:`Còn ${b.days} ngày`;
   if(b.age!=null&&b.age>0)age=` · tròn ${b.age} tuổi`}
  const ph=it.phone?` · <a href="tel:${esc(String(it.phone).replace(/[^+\d]/g,''))}">📞 ${esc(it.phone)}</a>`:'';
  return `<div class="it"><div class="dc"><small>Th ${esc(it.m)}</small><span>${esc(it.d)}</span></div><div class="m" data-edit="${it.id}"><b>${esc(it.name)}</b><div class="s">${it.rel?`<span class="tag">${esc(it.rel)}</span>`:''}${when}${age}${ph}</div>${it.note?`<div class="n">🎁 ${esc(it.note)}</div>`:''}</div></div>`}
 if(tab==='fun'){
  const K={'Phim':'🎬','Phim bộ':'📺','Game':'🎮','Sách':'📚','Nhạc':'🎧','Video':'▶️','Khác':'✨'},S={want:'📌 Muốn thử',doing:'▶️ Đang',done:'✅ Đã xong'};
  const st=it.rating?' '+'⭐'.repeat(+it.rating):'';
  return `<div class="it"><div class="m" data-edit="${it.id}"><b>${K[it.kind]||'🎬'} ${esc(it.name)}</b><div class="s"><span class="tag">${S[it.status||'want']}</span>${it.kind?`<span class="tag">${esc(it.kind)}</span>`:''}${st}</div>${it.where?`<div class="s">📍 ${esc(it.where)}</div>`:''}${it.note?`<div class="n">${esc(it.note)}</div>`:''}</div>${fav(it.fav,'⭐')}</div>`}
 if(tab==='gio'){
  const g=nextG(it);let when='',lan='';
  if(g){const p2=n=>String(n).padStart(2,'0'),ds=p2(g.date.getDate())+'/'+p2(g.date.getMonth()+1)+'/'+g.date.getFullYear();
   const c=g.days===0?'<span class="soon">Hôm nay</span>':g.days===1?'<span class="soon">Ngày mai</span>':g.days<=30?`<span class="soon">Còn ${g.days} ngày</span>`:`Còn ${g.days} ngày`;
   when=`Dương lịch: <span style="font-weight:800">${ds}</span> · ${c}`;if(it.y&&g.ly-(+it.y)>0)lan=` · giỗ lần thứ ${g.ly-(+it.y)}`}
  return `<div class="it"><div class="dc"><small>ÂL th ${esc(it.m)}</small><span>${esc(it.d)}</span></div><div class="m" data-edit="${it.id}"><b>🕯️ ${esc(it.name)}</b><div class="s">${it.rel?`<span class="tag">${esc(it.rel)}</span>`:''}${when}${lan}</div>${it.place?`<div class="s">📍 Tổ chức tại: ${esc(it.place)}</div>`:''}${it.note?`<div class="n">${esc(it.note)}</div>`:''}</div></div>`}
 return `<div class="it"><div class="m" data-edit="${it.id}"><b>${esc(it.name)}</b>${it.cat?`<div class="s"><span class="tag">${esc(it.cat)}</span></div>`:''}${it.note?`<div class="n">${esc(it.note)}</div>`:''}</div>${fav(it.fav,'📌')}</div>`;
}
function render(){
 document.body.dataset.tab=tab;const T=TABS[tab];
 $('ttl').textContent=T.ico+' '+T.ttl;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const n=db[tab].length;let sub=n+' '+T.one;
 if(tab==='song'||tab==='pub')sub+=' · '+db[tab].filter(x=>x.fav).length+' yêu thích';
 if(tab==='bday'){const u=db.bday.map(x=>({x,b:nextB(x)})).filter(o=>o.b).sort((a,b)=>a.b.days-b.b.days)[0];if(u)sub=u.b.days===0?'🎉 Hôm nay: '+u.x.name:'Sắp tới: '+u.x.name+' (còn '+u.b.days+' ngày)'}
 if(tab==='fun'){const c=s=>db.fun.filter(x=>(x.status||'want')===s).length;sub=n+' mục · '+c('doing')+' đang · '+c('want')+' muốn thử · '+c('done')+' đã xong'}
 if(tab==='gio'){const u=db.gio.map(x=>({x,b:nextG(x)})).filter(o=>o.b).sort((a,b)=>a.b.days-b.b.days)[0];if(u)sub=u.b.days===0?'🕯️ Hôm nay giỗ: '+u.x.name:'Sắp tới giỗ: '+u.x.name+' (còn '+u.b.days+' ngày)'}
 $('sub').textContent=n?sub:'Chưa có gì, bấm ＋ để thêm';
 $('chips').innerHTML=chipsFor().map(c=>`<button class="chip${filt[tab]===c[0]?' on':''}" data-f="${esc(c[0])}" type="button">${c[1]}</button>`).join('');
 const L=items();
 $('list').innerHTML=L.length?L.map(card).join(''):`<div class="empty"><div>${T.empty[0]}</div>${$('q').value.trim()||filt[tab]!=='all'?'Không tìm thấy mục nào.':T.empty[1]}</div>`;
}
function form(it){
 return TABS[tab].f.map(f=>{const k=f[0],l=f[1],t=f[2],v=it?it[k]:'';
  if(t==='dmy')return `<label>${l}</label><div class="g3"><input data-k="d" inputmode="numeric" maxlength="2" placeholder="Ngày" value="${esc(it?it.d:'')}"><input data-k="m" inputmode="numeric" maxlength="2" placeholder="Tháng" value="${esc(it?it.m:'')}"><input data-k="y" inputmode="numeric" maxlength="4" placeholder="${esc(f[3]||'Năm (tùy chọn)')}" value="${esc(it?it.y:'')}"></div>`;
  if(t==='sel')return `<label>${l}</label><select data-k="${k}">${f[3].map(o=>`<option value="${esc(o[0])}"${String(v||'')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  if(t==='area')return `<label>${l}</label><textarea data-k="${k}" rows="3" maxlength="800" placeholder="${esc(f[3])}" style="min-height:84px;font:inherit">${esc(v||'')}</textarea>`;
  return `<label>${l}</label><input data-k="${k}" ${t==='tel'?'type="tel" inputmode="tel"':''} maxlength="120" placeholder="${esc(f[3])}" value="${esc(v||'')}" autocomplete="off">`}).join('');
}
function openEdit(id){
 editId=id||null;const it=id?db[tab].find(x=>x.id===id):null;
 $('est').textContent=(it?'✏️ Sửa ':'＋ Thêm ')+TABS[tab].one;$('ef').innerHTML=form(it)+(tab==='note'?'<div class="sub">⚠️ Không nên lưu mật khẩu quan trọng (ngân hàng, email…) ở đây.</div>':'');$('em').textContent='';
 $('dl').hidden=!it;$('dl').textContent='🗑 Xóa mục này';$('dl').dataset.arm='';$('es').hidden=false;
}
$('fab').onclick=()=>openEdit(null);
$('ex').onclick=()=>{$('es').hidden=true};
$('es').addEventListener('click',e=>{if(e.target===$('es'))$('es').hidden=true});
$('sv').onclick=()=>{
 const o={};document.querySelectorAll('#ef [data-k]').forEach(e=>{o[e.dataset.k]=e.value.trim()});
 if(!o.name){$('em').textContent='Vui lòng nhập '+TABS[tab].f[0][1].toLowerCase()+'.';return}
 if(tab==='bday'||tab==='gio'){const d=+o.d,m=+o.m,mx=tab==='gio'?30:31;if(!(d>=1&&d<=mx&&m>=1&&m<=12)){$('em').textContent='Nhập ngày (1-'+mx+') và tháng (1-12) hợp lệ.';return}o.d=String(d);o.m=String(m);if(o.y&&!(+o.y>=1900&&+o.y<=2100))o.y=''}
 if(editId){const i=db[tab].findIndex(x=>x.id===editId);db[tab][i]=Object.assign(db[tab][i],o,{ts:Date.now()})}
 else db[tab].push(Object.assign({id:uid(),fav:false,ts:Date.now()},o));
 save();$('es').hidden=true;render();
};
$('dl').onclick=()=>{
 if(!$('dl').dataset.arm){$('dl').dataset.arm=1;$('dl').textContent='Bấm lần nữa để xác nhận xóa';setTimeout(()=>{$('dl').dataset.arm='';$('dl').textContent='🗑 Xóa mục này'},2500);return}
 db[tab]=db[tab].filter(x=>x.id!==editId);save();$('es').hidden=true;render();
};
$('list').addEventListener('click',e=>{
 const f=e.target.closest('[data-fav]');
 if(f){const it=db[tab].find(x=>x.id===f.dataset.fav);if(it){it.fav=!it.fav;save();render()}return}
 const d=e.target.closest('[data-edit]');if(d&&!e.target.closest('a'))openEdit(d.dataset.edit);
});
$('chips').addEventListener('click',e=>{const c=e.target.closest('[data-f]');if(c){filt[tab]=c.dataset.f;render()}});
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;$('q').value='';render();try{window.scrollTo(0,0)}catch(x){}}});
$('q').addEventListener('input',render);
// theme
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);$('theme').textContent=t==='dark'?'☀️':'🌙'}
let theme=LS.get('sotay_theme')||'light';applyTheme(theme);
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);LS.set('sotay_theme',theme)};
// backup
const dataCode=()=>'STV1:'+btoa(unescape(encodeURIComponent(JSON.stringify(db))));
$('shr').hidden=!navigator.share;
$('cfg').onclick=()=>{$('msg').textContent='';$('cs').hidden=false};
$('cx').onclick=()=>{$('cs').hidden=true};
$('cs').addEventListener('click',e=>{if(e.target===$('cs'))$('cs').hidden=true});
$('exp').onclick=async()=>{const c=dataCode(),n=Object.values(db).reduce((s,a)=>s+a.length,0);
 try{await navigator.clipboard.writeText(c);$('out').hidden=true;$('msg').textContent='✅ Đã copy '+n+' mục. Mở Zalo hoặc Ghi chú, bấm Dán để cất.'}
 catch(e){$('out').value=c;$('out').hidden=false;$('out').select();$('msg').textContent='Máy chưa tự copy được. Chạm giữ vào ô vừa hiện ra, chọn Chọn tất cả rồi Copy.'}};
$('shr').onclick=async()=>{try{await navigator.share({title:'Sổ Tay Vui',text:dataCode()})}catch(e){}};
$('imp').onclick=async()=>{
 let raw=$('code').value;
 if(!raw.trim()){try{raw=await navigator.clipboard.readText();$('code').value=raw}catch(e){}}
 if(!raw.trim()){$('msg').textContent='Chưa có dữ liệu. Copy dữ liệu đã cất, chạm giữ vào ô trên, chọn Dán rồi bấm lại.';return}
 try{
  const o=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/\s/g,'').replace(/^STV1:/,'')))));let n=0;
  Object.keys(db).forEach(k=>{if(!Array.isArray(o[k]))return;o[k].forEach(it=>{if(!it||!it.id)return;const i=db[k].findIndex(x=>x.id===it.id);if(i>=0)db[k][i]=it;else db[k].push(it);n++})});
  save();render();$('code').value='';$('msg').textContent='✅ Đã nhập '+n+' mục.';
 }catch(e){$('msg').textContent='❌ Dữ liệu không hợp lệ. Hãy copy đủ toàn bộ nội dung rồi dán lại.'}};
render();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
